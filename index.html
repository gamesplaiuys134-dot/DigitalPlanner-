    <!-- Extension & Environment Compatibility Polyfill -->
    <script>
      (function() {
        try {
          var originalFetch = window.fetch;
          var _currentFetch = originalFetch;
          Object.defineProperty(window, "fetch", {
            get: function() { return _currentFetch; },
            set: function(val) { _currentFetch = val; },
            configurable: true,
            enumerable: true
          });
        } catch (e) {}

        window.addEventListener("error", function(event) {
          if (
            (event.filename && event.filename.indexOf("chrome-extension://") !== -1) ||
            (event.message && event.message.indexOf("Cannot set property fetch") !== -1)
          ) {
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            if (event.preventDefault) event.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>
